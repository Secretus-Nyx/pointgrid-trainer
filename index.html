<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PointGrid Trainer">
<title>PointGrid Trainer</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #e2e5ea;
    --border-strong: #c6cbd3;
    --text: #1a1d23;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --red: #e11d48;
    --green: #16a34a;
    --grid: #e4e7ec;
    --shadow: 0 2px 10px rgba(16, 24, 40, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ===== 顶部栏 ===== */
  header#topbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 10px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    z-index: 10;
  }
  .brand {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-right: 8px;
    white-space: nowrap;
  }
  .brand small {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.2px;
  }
  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .field {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  select, input[type="number"] {
    min-height: 44px;
    min-width: 62px;
    padding: 0 8px;
    font-size: 16px;
    font-weight: 600;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="number"] {
    width: 76px;
    text-align: center;
  }
  .mode-toggle {
    display: flex;
    gap: 4px;
    background: #eef0f3;
    border-radius: 10px;
    padding: 4px;
  }
  .mode-toggle button {
    min-height: 36px;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .mode-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  .btn {
    min-height: 44px;
    padding: 0 18px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
  }
  .btn:active { background: var(--accent-dark); }
  .btn:disabled {
    background: #cbd2dc;
    color: #fff;
    cursor: default;
  }
  .btn.ghost {
    background: #eef0f3;
    color: var(--text);
  }
  .btn.ghost:active { background: #dfe3e8; }
  .btn.ghost:disabled { color: #aab0ba; background: #eef0f3; }
  .btn.danger {
    background: #fff;
    color: var(--red);
    border: 1px solid #fecdd3;
  }
  .btn.danger:active { background: #fff1f2; }

  /* ===== 主区域：左右面板 ===== */
  main#stage {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 16px;
    padding: 12px 16px;
  }
  .panel {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 10px;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    padding: 2px 4px 8px;
    min-height: 22px;
  }
  .panel-head .tag {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: #eaf1ff;
    border-radius: 6px;
    padding: 2px 8px;
  }
  .canvas-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    border-radius: 8px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ===== 底部 HUD ===== */
  footer#hud {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--card);
    border-top: 1px solid var(--border);
    min-height: 62px;
  }
  #status {
    font-size: 15px;
    font-weight: 700;
    min-width: 150px;
  }
  #hint {
    flex: 1;
    font-size: 14px;
    color: var(--text-dim);
  }
  #statsbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--text-dim);
    background: #eef0f3;
    border-top: 1px solid var(--border);
  }
  #statsbar strong { color: var(--text); }

  /* ===== 覆盖层（反馈 / 报告） ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .overlay[hidden] { display: none; }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(16, 24, 40, 0.25);
    width: min(640px, 100%);
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .card-body {
    padding: 20px 22px;
    overflow: auto;
  }
  .card-body h2 {
    margin: 0 0 14px;
    font-size: 20px;
    letter-spacing: -0.2px;
  }
  .card-actions {
    padding: 14px 22px 18px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    border-top: 1px solid var(--border);
  }
  .card-actions .btn { min-width: 140px; }

  table.feed {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.feed th, table.feed td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    white-space: nowrap;
  }
  table.feed th {
    color: var(--text-dim);
    font-weight: 600;
    font-size: 12px;
    background: #fafbfc;
  }
  .score-line {
    margin-top: 14px;
    font-size: 16px;
    text-align: right;
  }
  .score-line strong { color: var(--accent); font-size: 22px; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin: 6px 0 16px;
  }
  .stat-grid > div {
    background: #f7f8fa;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
  }
  .stat-grid strong {
    display: block;
    font-size: 20px;
    color: var(--text);
    margin-top: 4px;
  }
  .details details {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    background: #fafbfc;
  }
  .details summary {
    padding: 10px 12px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .det-row {
    padding: 6px 14px 6px 24px;
    font-size: 13px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
  }
  .round-viz {
    padding: 10px 14px 12px;
    border-top: 1px solid var(--border);
  }
  .round-viz canvas.mini {
    display: block;
    margin: 0 auto 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .round-viz .det-row {
    padding: 3px 0;
    border-top: none;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .history-list .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    background: #fafbfc;
  }
  .history-list .item .t {
    color: var(--text-dim);
    font-size: 12px;
    min-width: 120px;
  }

  @media (max-width: 720px) {
    .brand { margin-right: 0; }
    .controls { gap: 6px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">PointGrid Trainer
    <small>素描空间定位训练</small>
  </div>
  <div class="controls">
    <label class="field">网格
      <input type="number" id="gridInput" min="2" max="20" step="1" value="10" inputmode="numeric">
    </label>
    <label class="field">点数
      <input type="number" id="pointsInput" min="1" max="20" step="1" value="1" inputmode="numeric">
    </label>
    <div class="field">模式
      <div class="mode-toggle" id="modeToggle">
        <button type="button" data-mode="A" class="active">A 即时反馈</button>
        <button type="button" data-mode="B">B 连续训练</button>
      </div>
    </div>
    <label class="field">次数
      <input type="number" id="roundsInput" min="1" max="100" step="1" value="10" inputmode="numeric">
    </label>
    <button type="button" class="btn" id="startBtn">开始训练</button>
    <button type="button" class="btn ghost" id="retrainBtn" disabled>重练上次</button>
  </div>
</header>

<main id="stage">
  <div class="panel">
    <div class="panel-head" id="refHead">
      <span>参考区</span>
      <span class="tag">目标点</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="refCanvas"></canvas>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head">
      <span>练习区</span>
      <span class="tag" id="progTag">待开始</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="workCanvas"></canvas>
    </div>
  </div>
</main>

<footer id="hud">
  <div id="status">就绪</div>
  <div id="hint">设置参数后点击「开始训练」</div>
  <button type="button" class="btn ghost" id="undoBtn" disabled>撤销上一笔</button>
  <button type="button" class="btn" id="actionBtn" disabled>—</button>
  <button type="button" class="btn danger" id="exitBtn" hidden>退出训练</button>
</footer>

<div id="statsbar">
  <span>已训练 <strong id="statSessions">0</strong> 次</span>
  <span>·</span>
  <span>平均分 <strong id="statAvg">—</strong></span>
  <span style="flex:1"></span>
  <button type="button" class="btn ghost" id="histBtn" style="min-height:34px;font-size:13px">历史记录</button>
  <button type="button" class="btn ghost" id="clearBtn" style="min-height:34px;font-size:13px">清空训练历史</button>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card">
    <div class="card-body" id="overlayBody"></div>
    <div class="card-actions">
      <button type="button" class="btn ghost" id="overlayBtn2" hidden>—</button>
      <button type="button" class="btn" id="overlayBtn">确定</button>
    </div>
  </div>
</div>

<script>
'use strict';

const LIMITS = {
  grid: { min: 2, max: 20 },
  points: { min: 1, max: 20 },
  rounds: { min: 1, max: 100 }
};
const LS_KEY = 'pointgrid_trainer_v1';

const $ = (id) => document.getElementById(id);
const refCanvas = $('refCanvas');
const workCanvas = $('workCanvas');
const refCtx = refCanvas.getContext('2d');
const workCtx = workCanvas.getContext('2d');

let settings = { grid: 10, points: 1, mode: 'A', rounds: 10 };
let session = null;
let size = 0;
let dpr = 1;
let activePointerId = null;
let reportData = { rounds: null, grid: 10 };   // 报告缩略图数据
let presetRounds = null;   // 「重练上次」时注入的固定多轮点位（数组的数组）

/* ---------- 工具 ---------- */
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
function mean(arr) { return arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : 0; }
function fmt(n, d = 3) { return Number(n).toFixed(d); }
function signed(v) { return (v >= 0 ? '+' : '') + v.toFixed(3); }
function roundCoord(v) { return Math.round(v * 10000) / 10000; }

/* 误差 → 0~100 分：线性衰减，阈值 0.25（归一化），误差 0 得满分，≥0.25 得 0 分 */
function scoreFromError(d) {
  const threshold = 0.25;
  return Math.max(0, Math.min(100, 100 * (1 - d / threshold)));
}

/* 方向：以目标点为基准，用户点击相对目标的方位（上/下/左/右 组合） */
function directionOf(dx, dy) {
  const v = Math.abs(dx) < 0.001 ? '' : (dx > 0 ? '右' : '左');
  const h = Math.abs(dy) < 0.001 ? '' : (dy > 0 ? '下' : '上');
  return (h + v) || '正中';
}

/* ---------- 点生成（连续随机 + 最小间距 + 边距） ---------- */
function genPoints(n) {
  const pts = [];
  const margin = 0.03;
  const minD = 0.07;
  let attempts = 0;
  while (pts.length < n && attempts < 1500) {
    attempts++;
    const p = { x: margin + Math.random() * (1 - 2 * margin), y: margin + Math.random() * (1 - 2 * margin) };
    if (pts.every(q => Math.hypot(p.x - q.x, p.y - q.y) >= minD)) pts.push(p);
  }
  while (pts.length < n) {
    pts.push({ x: margin + Math.random() * (1 - 2 * margin), y: margin + Math.random() * (1 - 2 * margin) });
  }
  return pts;
}

/* ---------- 布局：两正方形面板尺寸一致 ---------- */
function layout() {
  const stage = $('stage');
  const headH = $('refHead').offsetHeight || 30;
  const pad = 12 * 2;   // stage 上下 padding
  const gap = 16;       // 面板间距
  const availW = stage.clientWidth - pad - gap;
  const availH = stage.clientHeight - pad - headH - 20; // 20 = 面板 padding
  size = Math.max(100, Math.min(availW / 2, availH));
  dpr = window.devicePixelRatio || 1;
  [refCanvas, workCanvas].forEach((c) => {
    c.style.width = size + 'px';
    c.style.height = size + 'px';
    c.width = Math.round(size * dpr);
    c.height = Math.round(size * dpr);
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  });
  draw();
}

/* ---------- 绘制 ---------- */
function px(nx) { return nx * size; }
function dotR() { return Math.max(1.95, size * 0.00455); }   /* 原始 0.014 的 50% 后再缩到 65% */
function numFont() { return Math.max(11, Math.round(size * 0.026)); }

function drawGrid(ctx) {
  ctx.clearRect(0, 0, size, size);
  const n = settings.grid;
  ctx.strokeStyle = '#e4e7ec';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const p = px(i / n);
    ctx.moveTo(p, 0); ctx.lineTo(p, size);
    ctx.moveTo(0, p); ctx.lineTo(size, p);
  }
  ctx.stroke();
  ctx.strokeStyle = '#c6cbd3';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0.75, 0.75, size - 1.5, size - 1.5);
}

function drawTargets(ctx) {
  const round = currentRound();
  if (!round) return;
  round.points.forEach((p, i) => {
    const x = px(p.x), y = px(p.y);
    ctx.fillStyle = '#1f2933';
    ctx.beginPath();
    ctx.arc(x, y, dotR(), 0, Math.PI * 2);
    ctx.fill();
    // 编号作为点旁小标签（左上角，深色，防止贴边裁切）
    const tx = clamp(x - dotR() - 3, numFont() + 2, size - 2);
    const ty = clamp(y - dotR() - 3, numFont() + 2, size - 2);
    ctx.fillStyle = '#1f2933';
    ctx.font = '700 ' + numFont() + 'px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText(String(i + 1), tx, ty);
  });
}

function drawCross(ctx, x, y, color, scale) {
  const s = dotR() * 1.7 * (scale || 1);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x - s, y); ctx.lineTo(x + s, y);
  ctx.moveTo(x, y - s); ctx.lineTo(x, y + s);
  ctx.stroke();
}

function drawRing(ctx, x, y, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(x, y, dotR() + 3, 0, Math.PI * 2);
  ctx.stroke();
}

function currentRound() {
  if (!session) return null;
  let r = session.rounds[session.roundIndex];
  if (!r) {
    const pre = presetRounds && presetRounds[session.roundIndex];
    const pts = pre ? pre.slice() : genPoints(settings.points);
    r = { points: pts, clicks: [], answered: false, results: null, score: 0 };
    session.rounds[session.roundIndex] = r;
  }
  return r;
}

function draw() {
  if (!size) return;
  drawGrid(refCtx);
  drawGrid(workCtx);
  const round = currentRound();
  if (!round) return;

  drawTargets(refCtx);

  // 用户已点击位置（两种模式都显示，便于回看确认）
  round.clicks.forEach((c) => {
    if (c) drawCross(workCtx, px(c.x), px(c.y), '#e11d48');
  });

  // Mode A 已作答：显示正确点 + 误差连线
  if (settings.mode === 'A' && round.answered) {
    round.points.forEach((p, i) => {
      const u = round.clicks[i];
      if (!u) return;
      workCtx.strokeStyle = '#e11d48';
      workCtx.setLineDash([4, 4]);
      workCtx.lineWidth = 1.2;
      workCtx.beginPath();
      workCtx.moveTo(px(u.x), px(u.y));
      workCtx.lineTo(px(p.x), px(p.y));
      workCtx.stroke();
      workCtx.setLineDash([]);
      drawRing(workCtx, px(p.x), px(p.y), '#16a34a');
    });
  }
}

/* 报告缩略图：画出一题的目标点与用户点击的差距（复用主画布的视觉语言） */
function drawMini(canvas, round, gridN) {
  const CSS = 220;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = CSS + 'px';
  canvas.style.height = CSS + 'px';
  canvas.width = Math.round(CSS * dpr);
  canvas.height = Math.round(CSS * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const p = (n) => n * CSS;
  const r = Math.max(2, CSS * 0.012);

  ctx.clearRect(0, 0, CSS, CSS);
  ctx.strokeStyle = '#e4e7ec';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= gridN; i++) {
    const q = p(i / gridN);
    ctx.moveTo(q, 0); ctx.lineTo(q, CSS);
    ctx.moveTo(0, q); ctx.lineTo(CSS, q);
  }
  ctx.stroke();
  ctx.strokeStyle = '#c6cbd3';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, CSS - 1, CSS - 1);

  // 误差连线 + 正确点绿圈（先画，让点压在上面）
  round.points.forEach((pt, i) => {
    const u = round.clicks[i];
    if (!u) return;
    ctx.strokeStyle = '#e11d48';
    ctx.setLineDash([3, 3]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(p(u.x), p(u.y));
    ctx.lineTo(p(pt.x), p(pt.y));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = '#16a34a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(p(pt.x), p(pt.y), r + 2, 0, Math.PI * 2);
    ctx.stroke();
  });

  // 用户点击（红叉）
  round.clicks.forEach((c) => {
    if (!c) return;
    const x = p(c.x), y = p(c.y);
    const s = r * 1.6;
    ctx.strokeStyle = '#e11d48';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - s, y); ctx.lineTo(x + s, y);
    ctx.moveTo(x, y - s); ctx.lineTo(x, y + s);
    ctx.stroke();
  });

  // 目标点（深色圆 + 编号标签）
  round.points.forEach((pt, i) => {
    const x = p(pt.x), y = p(pt.y);
    ctx.fillStyle = '#1f2933';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    const font = Math.max(9, Math.round(CSS * 0.05));
    const tx = clamp(x - r - 2, font + 2, CSS - 2);
    const ty = clamp(y - r - 2, font + 2, CSS - 2);
    ctx.fillStyle = '#1f2933';
    ctx.font = '700 ' + font + 'px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText(String(i + 1), tx, ty);
  });
}

/* ---------- 输入（Pointer Events：Pencil / 鼠标 / 触控） ---------- */
workCanvas.addEventListener('pointerdown', (e) => {
  if (!session || !currentRound() || currentRound().answered) return;
  if (e.pointerType === 'touch') return; // 掌托/手指触摸直接忽略，仅响应 Pencil 与鼠标
  if (activePointerId !== null) return;  // 忽略并发触点
  activePointerId = e.pointerId;
  try { workCanvas.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
  const rect = workCanvas.getBoundingClientRect();
  const nx = clamp((e.clientX - rect.left) / rect.width, 0, 1);
  const ny = clamp((e.clientY - rect.top) / rect.height, 0, 1);
  currentRound().clicks.push({ x: nx, y: ny });
  draw();
  updateHud();
  if (currentRound().clicks.length >= settings.points) completeRound();
});

// 关键修复：用 window 级 pointerup/pointercancel。
// 反馈弹层弹出后，pointerup 会落在弹层上（而非画布），必须在此清空 activePointerId，
// 否则下一题的第一下点击会被误判为并发触点而忽略，导致“要点两次”。
window.addEventListener('pointerup', () => { activePointerId = null; });
window.addEventListener('pointercancel', () => { activePointerId = null; });
workCanvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------- 流程 ---------- */
function start() {
  readSettings();
  presetRounds = null;
  beginSession();
}

function retrainLast() {
  const s = loadStats();
  const h = s.history && s.history[0];
  if (!h || !h.roundsData || !h.roundsData.length) return;
  settings.grid = h.grid;
  settings.mode = h.mode;
  settings.points = h.points;
  settings.rounds = h.roundsData.length;
  presetRounds = h.roundsData.map((r) => r.points.slice());
  beginSession();
}

function beginSession() {
  session = { roundIndex: 0, rounds: [] };
  activePointerId = null;
  setControlsEnabled(false);
  $('startBtn').textContent = '训练中…';
  $('startBtn').disabled = true;
  hideOverlay();
  draw();
  updateHud();
}

function completeRound() {
  activePointerId = null;
  const round = currentRound();
  round.answered = true;
  round.results = round.points.map((p, i) => {
    const u = round.clicks[i];
    const dx = u.x - p.x, dy = u.y - p.y;
    const d = Math.hypot(dx, dy);
    return { dx, dy, d, score: scoreFromError(d), dir: directionOf(dx, dy) };
  });
  round.score = mean(round.results.map((r) => r.score));
  draw();
  if (settings.mode === 'A') showFeedback(round);
  updateHud();
}

function advance() {
  if (!session) return;
  if (session.roundIndex + 1 >= settings.rounds) {
    finishSession();
  } else {
    session.roundIndex++;
    activePointerId = null;
    draw();
    updateHud();
  }
}

function undoLastStroke() {
  const round = currentRound();
  if (!session || !round || round.clicks.length === 0) return;
  round.clicks.pop();
  if (round.answered) {
    round.answered = false;
    round.results = null;
    round.score = 0;
  }
  hideOverlay();
  draw();
  updateHud();
}

function exitSession() {
  // 连续训练（Mode B）中退出：保留已完成的题（未完成的当前题丢弃），并弹出与正常完成一致的总结界面
  let summary = null;
  if (session && settings.mode === 'B') {
    const completed = session.rounds.filter((r) => r.answered);
    if (completed.length) {
      summary = summaryOf(completed);
      saveStats(summary);
    }
  }
  session = null;
  activePointerId = null;
  hideOverlay();
  if (summary) showReport(summary);
  readSettings();
  setControlsEnabled(true);
  $('startBtn').textContent = '开始训练';
  $('startBtn').disabled = false;
  draw();
  updateHud();
}

function summaryOf(rounds) {
  const scores = rounds.map((r) => r.score);
  const allRes = rounds.flatMap((r) => r.results);
  return {
    rounds,
    avgScore: mean(scores),
    avgError: mean(allRes.map((r) => r.d)),
    best: scores.length ? Math.max.apply(null, scores) : 0,
    worst: scores.length ? Math.min.apply(null, scores) : 0
  };
}

function finishSession() {
  const summary = summaryOf(session.rounds);
  saveStats(summary);
  showReport(summary);

  session = null;
  readSettings();
  setControlsEnabled(true);
  $('startBtn').textContent = '开始训练';
  $('startBtn').disabled = false;
  draw();
  updateHud();
}

/* ---------- 反馈 / 报告 ---------- */
function showFeedback(round) {
  const last = session.roundIndex + 1 >= settings.rounds;
  const rows = round.points.map((p, i) => {
    const r = round.results[i];
    const u = round.clicks[i];
    return '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td>(' + fmt(p.x) + ', ' + fmt(p.y) + ')</td>' +
      '<td>(' + fmt(u.x) + ', ' + fmt(u.y) + ')</td>' +
      '<td>' + signed(r.dx) + (r.dx > 0 ? '右' : r.dx < 0 ? '左' : '') + '</td>' +
      '<td>' + signed(r.dy) + (r.dy > 0 ? '下' : r.dy < 0 ? '上' : '') + '</td>' +
      '<td>' + fmt(r.d) + '（' + (r.d * 100).toFixed(1) + '%）</td>' +
      '<td>' + r.score.toFixed(1) + '</td>' +
      '</tr>';
  }).join('');
  showOverlay(
    '<h2>本题反馈</h2>' +
    '<table class="feed"><thead><tr>' +
    '<th>点</th><th>目标点</th><th>用户点</th><th>X 偏差</th><th>Y 偏差</th><th>距离误差</th><th>得分</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="score-line">本题得分 <strong>' + round.score.toFixed(1) + '</strong></div>',
    last ? '查看结果' : '下一题',
    () => { if (last) finishSession(); else advance(); },
    { text: '撤销上一笔', onClick: undoLastStroke }
  );
}

function showReport(s, grid) {
  reportData = { rounds: s.rounds, grid: grid != null ? grid : settings.grid };
  const details = s.rounds.map((r, i) => {
    const rows = r.points.map((p, j) => {
      const res = r.results[j];
      const u = r.clicks[j];
      return '<div class="det-row">点 ' + (j + 1) + '：目标(' + fmt(p.x) + ', ' + fmt(p.y) +
        ')　用户(' + fmt(u.x) + ', ' + fmt(u.y) + ')　偏差 ' + (res.d * 100).toFixed(1) +
        '%　方向 ' + res.dir + '</div>';
    }).join('');
    return '<details><summary>第 ' + (i + 1) + ' 题 · 得分 ' + r.score.toFixed(1) + '</summary>' +
      '<div class="round-viz"><canvas class="mini" data-idx="' + i + '"></canvas>' +
      '<div class="det-list">' + rows + '</div></div>' +
      '</details>';
  }).join('');
  showOverlay(
    '<h2>训练报告</h2>' +
    '<div class="stat-grid">' +
    '<div>总题数<strong>' + s.rounds.length + '</strong></div>' +
    '<div>平均分<strong>' + s.avgScore.toFixed(1) + '</strong></div>' +
    '<div>平均误差<strong>' + (s.avgError * 100).toFixed(1) + '%</strong></div>' +
    '<div>最佳成绩<strong>' + s.best.toFixed(1) + '</strong></div>' +
    '<div>最差成绩<strong>' + s.worst.toFixed(1) + '</strong></div>' +
    '</div>' +
    '<div class="details">' + details + '</div>',
    '重新训练',
    () => {}
  );
  bindReportMiniCanvases();
}

// toggle 事件不会冒泡，必须直接绑定到每个 details 上（懒加载缩略图）
function bindReportMiniCanvases() {
  $('overlayBody').querySelectorAll('details').forEach((d) => {
    d.addEventListener('toggle', () => {
      if (!d.open) return;
      const canvas = d.querySelector('canvas.mini');
      if (canvas && !canvas.dataset.drawn) {
        canvas.dataset.drawn = '1';
        drawMini(canvas, reportData.rounds[+canvas.dataset.idx], reportData.grid);
      }
    });
  });
}

function showOverlay(html, btnText, action, secondary) {
  $('overlayBody').innerHTML = html;
  const btn = $('overlayBtn');
  btn.textContent = btnText;
  btn.onclick = () => { hideOverlay(); action(); };
  const btn2 = $('overlayBtn2');
  if (secondary) {
    btn2.hidden = false;
    btn2.textContent = secondary.text;
    btn2.onclick = secondary.onClick;
  } else {
    btn2.hidden = true;
    btn2.onclick = null;
  }
  $('overlay').hidden = false;
}
function hideOverlay() { $('overlay').hidden = true; }

/* ---------- HUD ---------- */
function updateHud() {
  updateRetrainBtn();
  const status = $('status'), hint = $('hint'), undoBtn = $('undoBtn'), actionBtn = $('actionBtn');
  const progTag = $('progTag');
  const exitBtn = $('exitBtn');

  exitBtn.hidden = !session;

  if (!session) {
    status.textContent = '就绪';
    hint.textContent = '设置参数后点击「开始训练」· 练习区仅响应 Apple Pencil / 鼠标';
    progTag.textContent = '待开始';
    undoBtn.disabled = true;
    actionBtn.disabled = true;
    actionBtn.textContent = '—';
    actionBtn.onclick = null;
    return;
  }

  const round = currentRound();
  const n = settings.points;
  const done = round.clicks.length;

  status.textContent = '第 ' + (session.roundIndex + 1) + '/' + settings.rounds + ' 题';
  progTag.textContent = (session.roundIndex + 1) + '/' + settings.rounds;

  undoBtn.disabled = done === 0;
  undoBtn.onclick = undoLastStroke;

  if (!round.answered) {
    hint.textContent = n > 1 ? '请用 Pencil 依次点击点 ' + (done + 1) : '请在右侧用 Pencil 点击目标位置';
    actionBtn.disabled = true;
    actionBtn.textContent = '点 ' + done + '/' + n;
    actionBtn.onclick = null;
  } else {
    const last = session.roundIndex + 1 >= settings.rounds;
    if (settings.mode === 'A') {
      hint.textContent = '本题得分 ' + round.score.toFixed(1);
      actionBtn.disabled = true;
      actionBtn.textContent = last ? '查看结果' : '下一题';
      actionBtn.onclick = null; // Mode A 由覆盖层按钮推进
    } else {
      hint.textContent = '本组完成，确认后进入下一题';
      actionBtn.disabled = false;
      actionBtn.textContent = last ? '完成训练' : '下一题';
      actionBtn.onclick = advance;
    }
  }
}

/* ---------- 设置 ---------- */
function readIntInput(id, min, max, def) {
  let v = parseInt($(id).value, 10);
  if (isNaN(v)) v = def;
  return clamp(v, min, max);
}
function readSettings() {
  settings.grid = readIntInput('gridInput', LIMITS.grid.min, LIMITS.grid.max, 10);
  settings.points = readIntInput('pointsInput', LIMITS.points.min, LIMITS.points.max, 1);
  settings.rounds = readIntInput('roundsInput', LIMITS.rounds.min, LIMITS.rounds.max, 10);
  settings.mode = $('modeToggle').querySelector('button.active').dataset.mode;
}
function setControlsEnabled(on) {
  ['gridInput', 'pointsInput', 'roundsInput'].forEach((id) => { $(id).disabled = !on; });
  $('modeToggle').querySelectorAll('button').forEach((b) => { b.disabled = !on; });
}

function initSettings() {
  const gridInput = $('gridInput'), pointsInput = $('pointsInput'), roundsInput = $('roundsInput');

  // 网格：输入合法值即实时重绘；失焦时校正到合法范围
  gridInput.addEventListener('input', () => {
    const v = parseInt(gridInput.value, 10);
    if (!isNaN(v) && v >= LIMITS.grid.min && v <= LIMITS.grid.max) {
      settings.grid = v;
      draw();
    }
  });
  gridInput.addEventListener('change', () => {
    settings.grid = readIntInput('gridInput', LIMITS.grid.min, LIMITS.grid.max, settings.grid);
    gridInput.value = settings.grid;
    draw();
  });
  pointsInput.addEventListener('change', () => {
    settings.points = readIntInput('pointsInput', LIMITS.points.min, LIMITS.points.max, settings.points);
    pointsInput.value = settings.points;
  });
  roundsInput.addEventListener('change', () => {
    settings.rounds = readIntInput('roundsInput', LIMITS.rounds.min, LIMITS.rounds.max, settings.rounds);
    roundsInput.value = settings.rounds;
  });

  $('modeToggle').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    $('modeToggle').querySelectorAll('button').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    settings.mode = b.dataset.mode;
  });

  $('startBtn').addEventListener('click', start);
  $('retrainBtn').addEventListener('click', retrainLast);
  $('exitBtn').addEventListener('click', exitSession);
  $('histBtn').addEventListener('click', showHistory);
  $('clearBtn').addEventListener('click', clearHistory);
}

/* ---------- localStorage 统计 ---------- */
function loadStats() {
  try {
    return JSON.parse(localStorage.getItem(LS_KEY)) || { sessions: 0, totalScore: 0, history: [] };
  } catch (e) {
    return { sessions: 0, totalScore: 0, history: [] };
  }
}
function saveStats(rec) {
  const s = loadStats();
  s.sessions += 1;
  s.totalScore += rec.avgScore;
  s.history.unshift({
    ts: Date.now(),
    mode: settings.mode,
    grid: settings.grid,
    points: settings.points,
    rounds: rec.rounds.length,
    avgScore: rec.avgScore,
    avgError: rec.avgError,
    best: rec.best,
    worst: rec.worst,
    // 保留每题的归一化点位与用户尝试点（供「重练上次」/ 历史回溯），坐标保留 4 位小数以省空间
    roundsData: rec.rounds.map((r) => ({
      points: r.points.map((p) => ({ x: roundCoord(p.x), y: roundCoord(p.y) })),
      clicks: r.clicks.map((c) => ({ x: roundCoord(c.x), y: roundCoord(c.y) })),
      score: r.score
    }))
  });
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {}
  renderStatsBar();
}
function renderStatsBar() {
  const s = loadStats();
  $('statSessions').textContent = String(s.sessions);
  $('statAvg').textContent = s.sessions ? (s.totalScore / s.sessions).toFixed(1) : '—';
  updateRetrainBtn();
}
function updateRetrainBtn() {
  const s = loadStats();
  const h = s.history && s.history[0];
  const hasLast = !!(h && h.roundsData && h.roundsData.length);
  $('retrainBtn').disabled = !!session || !hasLast;
}
function clearHistory() {
  if (!window.confirm('确定要清空所有训练历史记录吗？此操作不可撤销。')) return;
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  renderStatsBar();
}
function showHistory() {
  const s = loadStats();
  let body;
  if (!s.history.length) {
    body = '<h2>历史记录</h2><p style="color:#6b7280">暂无训练记录。</p>';
  } else {
    const items = s.history.map((h, i) => {
      const d = new Date(h.ts);
      const t = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0');
      return '<div class="item">' +
        '<span class="t">' + t + '</span>' +
        '<span>模式 ' + h.mode + '</span>' +
        '<span>网格 ' + h.grid + '×' + h.grid + '</span>' +
        '<span>' + h.points + ' 点</span>' +
        '<span>' + h.rounds + ' 题</span>' +
        '<span>平均分 ' + h.avgScore.toFixed(1) + '</span>' +
        '<span>误差 ' + (h.avgError * 100).toFixed(1) + '%</span>' +
        '<button type="button" class="btn ghost view-hist" data-idx="' + i + '" style="min-height:32px;font-size:12px;margin-left:auto">查看</button>' +
        '</div>';
    }).join('');
    body = '<h2>历史记录</h2><div class="history-list">' + items + '</div>';
  }
  showOverlay(body, '关闭', () => {});
  document.querySelectorAll('#overlayBody .view-hist').forEach((b) => {
    b.addEventListener('click', () => viewHistoryReport(+b.dataset.idx));
  });
}

function reconstructRounds(roundsData) {
  return roundsData.filter((d) => d && d.points && d.clicks).map((d) => {
    const results = d.points.map((p, i) => {
      const u = d.clicks[i];
      const dx = u.x - p.x, dy = u.y - p.y;
      const dist = Math.hypot(dx, dy);
      return { dx, dy, d: dist, score: scoreFromError(dist), dir: directionOf(dx, dy) };
    });
    return { points: d.points, clicks: d.clicks, results: results, answered: true, score: d.score };
  });
}

function viewHistoryReport(idx) {
  const s = loadStats();
  const h = s.history[idx];
  if (!h) return;
  if (!h.roundsData || !h.roundsData.length) {
    showOverlay('<h2>历史记录</h2><p style="color:#6b7280">该记录暂无详细点位数据。</p>', '关闭', () => {});
    return;
  }
  const rounds = reconstructRounds(h.roundsData);
  if (!rounds.length) {
    showOverlay('<h2>历史记录</h2><p style="color:#6b7280">该记录暂无详细点位数据。</p>', '关闭', () => {});
    return;
  }
  showReport({ rounds, avgScore: h.avgScore, avgError: h.avgError, best: h.best, worst: h.worst }, h.grid);
}

/* ---------- 启动 ---------- */
initSettings();
renderStatsBar();
layout();
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
</script>
</body>
</html>
